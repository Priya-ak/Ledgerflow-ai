name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL + real ClamAV)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lf, POSTGRES_PASSWORD: lf, POSTGRES_DB: ledgerflow_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lf" --health-interval 5s --health-timeout 5s --health-retries 10
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL 16
        env: { TEST_DATABASE_URL: "postgresql://lf:lf@localhost:5432/ledgerflow_test" }
        run: pytest
      - name: Migrations up / down / drift check on PostgreSQL
        env: { DATABASE_URL: "postgresql://lf:lf@localhost:5432/ledgerflow_test" }
        run: |
          python - <<'PY'
          import sqlalchemy as sa
          e = sa.create_engine("postgresql://lf:lf@localhost:5432/ledgerflow_test")
          with e.begin() as c:
              c.execute(sa.text("DROP SCHEMA public CASCADE; CREATE SCHEMA public"))
          PY
          alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Wait for ClamAV signatures to load
        run: |
          for i in $(seq 1 60); do
            python -c "import socket;s=socket.create_connection(('127.0.0.1',3310),3);s.sendall(b'zPING\0');assert s.recv(8).startswith(b'PONG')" && exit 0
            sleep 5
          done; exit 1
      - name: Real ClamAV integration tests
        env: { CLAMAV_TEST_HOST: "127.0.0.1" }
        run: pytest tests/test_malware.py -v

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Seed and start backend
        working-directory: backend
        run: |
          python -m app.demo.seed --reset
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npx next start -p 3000 > ../frontend.log 2>&1 &
          npx --yes wait-on@8.0.1 -t 60000 http://127.0.0.1:3000 http://127.0.0.1:8000/api/v1/health
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            backend.log
            frontend.log

  docker:
    name: Docker images build + container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deployment/backend.Dockerfile -t ledgerflow-api:ci .
      - name: Run container (SQLite, demo seed) and test OCR inside it
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET=ci-only-jwt-secret-0123456789abcdefghijklmn -e SECRET_KEY=ci-only-secret-0123456789abcdefghijklmn \
            -e SEED_DEMO_ON_START=true -e DATABASE_URL=sqlite:////app/storage/ci.db ledgerflow-api:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          TOKEN=$(curl -fs -X POST http://127.0.0.1:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"accountant@ledgerflow-demo.example","password":"LedgerFlow2026"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -fs -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/api/v1/system/status | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['ocr']);assert d['ocr']['available']"
          DOC=$(curl -fs -H "Authorization: Bearer $TOKEN" -F file=@sample-data/synthetic-invoices/08_needs_review.jpg \
            http://127.0.0.1:8000/api/v1/documents/upload | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -fs -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"document_id\":\"$DOC\"}" \
            http://127.0.0.1:8000/api/v1/invoices/extract | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['invoice_number'], d['extracted_data']['extraction_metadata']['text_method']);assert d['invoice_number']=='DOS-INV-88390'"
          docker inspect --format '{{.State.Health.Status}}' api
      - if: always()
        run: docker logs api || true
      - name: Build frontend image
        run: docker build -f deployment/frontend.Dockerfile -t ledgerflow-web:ci .
